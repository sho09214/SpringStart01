<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>店舗登録確認</title>
  <link rel="stylesheet" th:href="@{/css/mt-style.css}">
</head>
<body>
  <h2>店舗登録確認</h2>

  <div th:object="${mtRegistForm}">
    【店舗名】<br>
    <p th:text="*{restaurantName}"></p><br>
    <br>
    【キャッチフレーズ】<br>
    <p th:text="*{catchPhrase}"></p><br>
    <br>
  </div>

  <form th:action="@{/mt-confirm-regist}" method="post" th:object="${mtRegistForm}">
    <input type="hidden" th:field="*{restaurantName}">
    <input type="hidden" th:field="*{catchPhrase}">
    <input type="submit" value="登録実行" class="btn">
  </form>

  <form th:action="@{/mt-show-regist}" method="post" th:object="${mtRegistForm}">
    <input type="hidden" th:field="*{restaurantName}">
    <input type="hidden" th:field="*{catchPhrase}">
    <input type="submit" value="登録実行" class="btn">
  </form>

  <a th:href="@{/mt-top}">管理メニューに戻る</a>
</body>
</html>
